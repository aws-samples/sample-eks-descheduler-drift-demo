# Three web-tier Deployments (a fleet, not a single monolith Deployment):
#
#   web-frontend  — weight ~50% of the fleet
#   web-api       — weight ~30%
#   web-orders    — weight ~20%
#
# Each has its own Service, PDB, and soft topology spread constraint scoped to
# its own pods (labelSelector app: <name>) — which is how real clusters look,
# and how the descheduler actually evaluates violations: per workload, not per
# cluster. All pods also carry the shared label `workload: web` so scripts and
# dashboards can aggregate the fleet.
#
# All three run the CPU-intensive registry.k8s.io/hpa-example image (from the
# Kubernetes HPA walkthrough:
# https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale-walkthrough/)
# so their HPAs have something to scale on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: demo
  labels:
    app: web-frontend
    workload: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        workload: web
    spec:
      # No Kubernetes API access needed; don't mount a service account token.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway      # soft
          labelSelector:
            matchLabels:
              app: web-frontend
          matchLabelKeys:
            - pod-template-hash                  # spread per rollout; requires Kubernetes 1.27+
      containers:
        - name: web
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
            # runAsNonRoot / readOnlyRootFilesystem are deliberately NOT set:
            # the upstream hpa-example image (from the Kubernetes HPA
            # walkthrough) runs Apache, which binds :80 as root and writes its
            # pidfile to the root filesystem. Either setting breaks the pod.
            # Acceptable for a short-lived demo workload in its own namespace;
            # use a non-root image for anything production-facing.
          # TCP probes, not HTTP: a GET / on this image executes the CPU-burning
          # PHP handler, so HTTP probes would add constant load to every pod and
          # distort the HPA measurements the demo exists to take.
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m                          # HPA scales on this
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: demo
  labels:
    app: web-frontend
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-frontend-pdb
  namespace: demo
spec:
  maxUnavailable: 10%          # concurrency limit the descheduler honors
  selector:
    matchLabels:
      app: web-frontend
---
